[project]
name = "enjambre"
version = "0.1.0"
description = "Un modelo bueno piensa y reparte; muchos baratos ejecutan en paralelo; un juez de centavos revisa."
requires-python = ">=3.11"
dependencies = ["openai>=1.40", "httpx>=0.27", "python-dotenv>=1.0", "pyyaml>=6.0"]

[project.scripts]
enjambre = "enjambre.nucleo:cli"
enjambre-visor = "enjambre.servir:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["enjambre"]
